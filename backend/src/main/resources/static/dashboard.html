<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Smart Waste Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            margin: 0;
            text-align: center;
        }

        h2 { margin-top: 20px; }

        input, select {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        .load-btn { background: #4CAF50; }
        .hotspot-btn { background: #ff9800; }
        .done-btn { background: #4CAF50; }
        .delete-btn { background: #f44336; }

        table {
            width: 95%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: #007bff;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .badge {
            padding: 5px 8px;
            border-radius: 6px;
            color: white;
            font-size: 12px;
        }

        .high { background: red; }
        .medium { background: orange; }
        .low { background: green; }

        .ai-box {
            max-width: 260px;
            font-size: 13px;
            text-align: left;
            background: #f1f5ff;
            padding: 10px;
            border-radius: 8px;
            white-space: pre-line;
        }

        .status-pending { color: orange; font-weight: bold; }
        .status-completed { color: green; font-weight: bold; }

        img {
            border-radius: 8px;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        .box {
            margin-top: 20px;
            padding: 15px;
            background: white;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h2>Smart Waste Dashboard</h2>

<input type="text" id="search" placeholder="Search location..." onkeyup="displayData(globalData)">

<select id="filter" onchange="displayData(globalData)">
    <option value="ALL">All</option>
    <option value="PENDING">Pending</option>
    <option value="COMPLETED">Completed</option>
</select>

<button class="load-btn" onclick="loadComplaints()">Load</button>
<button class="hotspot-btn" onclick="loadHotspots()">Hotspots</button>

<table id="table"></table>

<div id="hotspots" class="box"></div>

<script>

    let globalData = [];

    function loadComplaints() {
        fetch("http://localhost:8080/api/complaints")
            .then(res => res.json())
            .then(data => {
                globalData = data;
                displayData(data);
            });
    }

    function displayData(data) {
        let table = document.getElementById("table");

        let search = document.getElementById("search").value.toLowerCase();
        let filter = document.getElementById("filter").value;

        let filtered = data.filter(c => {
            let matchSearch = c.location.toLowerCase().includes(search);
            let matchFilter = (filter === "ALL" || c.status === filter);
            return matchSearch && matchFilter;
        });

        let html = `
            <tr>
                <th>ID</th>
                <th>Description</th>
                <th>Location</th>
                <th>Status</th>
                <th>Priority</th>
                <th>AI Result</th>
                <th>Image</th>
                <th>Action</th>
            </tr>
        `;

        filtered.forEach(c => {

            // 🔥 FULL IMAGE FIX (handles all cases)
            let imageHTML = "No Image";

            if (c.imageUrl && c.imageUrl.trim() !== "") {

                if (c.imageUrl.startsWith("http")) {
                    imageHTML = `<img src="${c.imageUrl}" width="60">`;

                } else if (c.imageUrl.startsWith("data:image")) {
                    imageHTML = `<img src="${c.imageUrl}" width="60">`;

                } else {
                    imageHTML = `<img src="data:image/jpeg;base64,${c.imageUrl}" width="60">`;
                }
            }

            html += `
            <tr>
                <td>${c.id}</td>
                <td>${c.description}</td>
                <td>${c.location}</td>
                <td class="${c.status === 'PENDING' ? 'status-pending' : 'status-completed'}">${c.status}</td>
                <td>
                    <span class="badge ${c.priority?.toLowerCase()}">${c.priority || '-'}</span>
                </td>
                <td><div class="ai-box">${c.aiResult || '-'}</div></td>
                <td>${imageHTML}</td>
                <td>
                    <button class="done-btn" onclick="updateStatus(${c.id})">Done</button>
                    <button class="delete-btn" onclick="deleteComplaint(${c.id})">Delete</button>
                </td>
            </tr>
            `;
        });

        table.innerHTML = html;
    }

    function loadHotspots() {
        fetch("http://localhost:8080/api/complaints/hotspots")
            .then(res => res.json())
            .then(data => {
                let div = document.getElementById("hotspots");
                div.innerHTML = "<h3>Hotspots</h3>";

                data.forEach(h => {
                    div.innerHTML += `<p>${h[0]} → ${h[1]}</p>`;
                });
            });
    }

    function updateStatus(id) {
        fetch(`http://localhost:8080/api/complaints/${id}/status?status=COMPLETED`, {
            method: "PUT"
        }).then(() => loadComplaints());
    }

    function deleteComplaint(id) {
        fetch(`http://localhost:8080/api/complaints/${id}`, {
            method: "DELETE"
        }).then(() => loadComplaints());
    }

    // 🔥 auto load on open (optional but useful)
    window.onload = loadComplaints;

</script>
</body>
</html>
